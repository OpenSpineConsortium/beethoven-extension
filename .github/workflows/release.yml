name: Release the extension

# The Chrome Web Store release kit (OpenSpineConsortium/chrome-store-release-kit,
# release-kit/README.md): every push to main runs the checks, builds the store
# zip as version <manifest>.<commit count> and keeps it as a GitHub release;
# the repository variable CWS_ON_PUSH (upload or publish) sends that zip on to
# the store item through the five CWS_ secrets. A tag extension-v<version>
# releases that exact version and always uploads it. Run workflow with upload
# and/or publish ticked does it by hand. The kit itself is taken from that
# repository at main on every run, so a fix there reaches this repository's
# next release with no change here.
#
# greg, 2026-10-13: "i want to setup the automatic updates being pushed to the
# chrome webstore". The five secrets are the store's own OAuth client and its
# refresh token, the one credential this repository keeps in CI; no Claude
# credential and no API key is ever among them (CLAUDE.md). Until the five
# secrets exist the store step says "Not configured" and the run stays green,
# so the GitHub release is made either way (docs/store/SUBMISSION.md,
# "Releases from CI").
#
# Beethoven is built by WXT, so the kit takes the zip `npm run zip` writes
# (extension/.output/beethoven-<version>-chrome.zip; the Firefox zip beside it
# is never uploaded) and stamps the build number into its manifest; the kit's
# own packager is not used.

on:
  push:
    branches: [main]
    tags: ['extension-v*']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the zip to the Chrome Web Store item (needs the CWS_ secrets)'
        type: boolean
        default: false
      publish:
        description: 'Submit the draft for review (it goes out on approval with the visibility the item has in the dashboard)'
        type: boolean
        default: false

# The release needs to write; one release at a time, in the order they
# started, so a lower build never follows a higher one to the store.
permissions:
  contents: write

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  release:
    uses: OpenSpineConsortium/chrome-store-release-kit/.github/workflows/release-kit.yml@main
    with:
      name: beethoven
      node-version: '22'
      setup: cd extension && npm ci
      test: cd extension && npm run sync-profiles && npm run typecheck && npx vitest run
      build: cd extension && npm run zip
      zip: extension/.output/*-chrome.zip
      on-push: ${{ vars.CWS_ON_PUSH }}
      upload: ${{ inputs.upload == true }}
      publish: ${{ inputs.publish == true }}
    # The five store secrets by name, and nothing else of this repository's.
    secrets:
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
