name: ci
# The extension's suite in the environment it really has: Node 22, a real bash for the mock
# portal's stand-ins, python with asyncssh for the grid stand-in the ssh tests speak to, and
# Playwright's Chromium for the mock's terminal section. No secrets: every test runs against
# the mock portal and the bundled stand-ins; nothing here can reach a grid or claude.ai.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bridge-binary:
    # the bridge's binary edition: built per platform and held to the same wire contract the script
    # hosts answer to (helper/test/suite.mjs, host-agnostic). Unsigned on purpose — signing needs
    # identities no repository may hold — so these artifacts are for maintainers and collaborators;
    # students' bridge stays the script zips inside the extension.
    name: bridge (rust, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # host spelled per platform: on Windows the suite launches it through cmd.exe, which
          # splits an unquoted forward-slash path at its switches
          - { os: ubuntu-latest, bin: beethoven-bridge, out: beethoven-bridge-linux-x86_64, host: helper/src/rust/target/release/beethoven-bridge }
          - { os: macos-latest, bin: beethoven-bridge, out: beethoven-bridge-mac-arm64, host: helper/src/rust/target/release/beethoven-bridge }
          - { os: windows-latest, bin: beethoven-bridge.exe, out: beethoven-bridge-windows-x86_64.exe, host: helper\src\rust\target\release\beethoven-bridge.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build
        working-directory: helper/src/rust
        run: cargo build --release
      - name: the wire contract, the same 17 checks every host answers
        run: node helper/test/suite.mjs --host "${{ matrix.host }}" --label rust-${{ runner.os }}
      - name: name the artifact for its platform
        shell: bash
        run: cp "helper/src/rust/target/release/${{ matrix.bin }}" "${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          retention-days: 90

  suite:
    name: typecheck, vitest, mock selftest, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: asyncssh, for the grid stand-in the ssh tests run against
        run: pip install asyncssh
      - run: npm ci
      - name: profiles and agreement texts into public/ (the tests read them)
        run: npm run sync-profiles
      - run: npm run typecheck
      - run: npx vitest run
      - name: Playwright Chromium, for the mock's terminal section
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: mock portal selftest (every section, a real browser for the terminal)
        run: PLAYWRIGHT_DIR="$PWD/node_modules/playwright" node e2e/mock-selftest.mjs
      - name: build (chrome)
        run: npm run build:chrome
      - name: the install steps travel inside the zip, beside manifest.json
        run: cp ../.github/artifact-install.md .output/chrome-mv3/INSTALL.md
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: chrome-mv3
          path: extension/.output/chrome-mv3
          retention-days: 90
      - name: the download link and the same steps on the run page itself
        run: |
          V=$(node -p "require('./package.json').version")
          { echo "## Beethoven $V — [⬇️ download the extension (one zip, Mac and Windows alike)](${{ steps.upload.outputs.artifact-url }})"
            echo
            cat ../.github/artifact-install.md
          } >> "$GITHUB_STEP_SUMMARY"
