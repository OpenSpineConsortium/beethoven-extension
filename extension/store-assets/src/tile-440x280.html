<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small promo tile (440x280)</title>
<link rel="stylesheet" href="store.css">
<style>
  .canvas { --w: 440px; --h: 280px; --mask-w: 70%; --mask-h: 70%; --mask-y: 46%; --grid-x: 28px; --grid-y: 12px; }
  .lockup {
    position: absolute;
    left: 0; right: 0; top: 50%;
    transform: translateY(-58%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .lockup img { width: 120px; height: 120px; display: block; margin-left: -14px; }
  .name {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 50px;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--ink);
  }
  .line {
    font-family: var(--font-display);
    font-size: 19px;
    line-height: 1.2;
    margin-top: 9px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .line em { color: var(--teal); font-style: italic; }
  .fine { left: 0; right: 0; bottom: 18px; text-align: center; font-size: 11px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="lockup">
    <img src="icon/icon.svg" alt="">
    <div>
      <div class="name">Beethoven</div>
      <div class="line">Your grid. <em>From claude.ai.</em></div>
    </div>
  </div>
  <p class="fine">Not an Anthropic product.</p>
</div>
<script src="common.js"></script>
</body>
</html>
