<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marquee promo tile (1400x560)</title>
<link rel="stylesheet" href="store.css">
<link rel="stylesheet" href="diagram.css">
<style>
  .canvas { --w: 1400px; --h: 560px; --mask-x: 70%; --mask-y: 52%; --mask-w: 48%; --mask-h: 72%; }
  .text { position: absolute; left: 88px; top: 50%; transform: translateY(-54%); width: 470px; }
  .brand { font-size: 26px; gap: 12px; margin: 0 0 30px 0; }
  .brand img { width: 40px; height: 40px; }
  .h { font-size: 68px; }
  .lede { font-size: 22px; margin-top: 20px; max-width: 400px; }
  .fig { position: absolute; left: 596px; top: 98px; width: 768px; }
  .fig .flow { margin: 0; max-width: none; }
  .fine { left: 88px; bottom: 30px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="text">
    <div class="brand"><img src="icon/icon-48.svg" alt="">Beethoven</div>
    <h1 class="h"><span class="l">Your grid.</span> <em>From claude.ai.</em></h1>
    <p class="lede">Ask in claude.ai. Your worker on the grid does the work.</p>
  </div>
  <div class="fig" data-flow></div>
  <p class="fine">Not an Anthropic product.</p>
</div>
<script src="diagram.js"></script>
<script src="common.js"></script>
</body>
</html>
